name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Validate Shell Script Syntax (sh -n)
        run: |
          echo "=== Checking shell syntax ==="
          for f in extensions/sshk/bin/* install-to-kindle.sh authorize-server.sh; do
            if [ -f "$f" ] && [ "$f" != "extensions/sshk/bin/dropbearmulti" ]; then
              sh -n "$f" && echo "✓ $f" || { echo "✗ Syntax error in $f"; exit 1; }
            fi
          done

      - name: Validate KUAL Files (config.xml & menu.json)
        run: |
          python3 -c "
          import json, os, stat, xml.etree.ElementTree as ET
          # Validate XML
          tree = ET.parse('extensions/sshk/config.xml')
          root = tree.getroot()
          assert root.tag == 'extension', 'Root element must be extension'
          ext_id = root.findtext('./information/id')
          assert ext_id == 'sshk', f'config.xml id ({ext_id}) must match directory name (sshk)'
          print('✓ config.xml is valid XML, id matches directory')

          # Validate JSON structure
          data = json.load(open('extensions/sshk/menu.json'))
          assert 'items' in data
          assert len(data['items']) > 0

          # Cross-reference: every menu action must exist and be executable
          base = 'extensions/sshk'
          for item in data['items']:
              action = item['action']
              path = os.path.join(base, action)
              assert os.path.isfile(path), f'menu item {item[\"name\"]!r}: missing {action}'
              mode = os.stat(path).st_mode
              assert mode & stat.S_IXUSR, f'{action} referenced by menu but not executable'
              print(f\"✓ priority {item['priority']}: {action} exists and is executable\")
          "

      - name: Run ShellCheck
        run: |
          # Allow intentional word splitting for OPTS/KEY_ARGS (SC2086)
          shellcheck -e SC2086,SC2016 \
            extensions/sshk/bin/*.sh \
            extensions/sshk/bin/ssh \
            extensions/sshk/bin/ssh-tailscale \
            extensions/sshk/bin/ssh-menu \
            extensions/sshk/bin/sshk \
            extensions/sshk/bin/scp \
            extensions/sshk/bin/scp-tailscale \
            install-to-kindle.sh \
            authorize-server.sh

      - name: Test Host Alias Resolution
        run: |
          python3 -c "
          import os
          conf = 'extensions/sshk/hosts.conf'
          assert os.path.exists(conf), 'hosts.conf missing'
          print('✓ hosts.conf exists')
          "

      - name: Run Functional Tests (wrapper argv behavior)
        run: |
          ./tests/run-tests.sh

      - name: Verify binary portability (static ARMv5 soft-float)
        run: |
          BIN=extensions/sshk/bin/dropbearmulti
          file "$BIN"
          readelf -A "$BIN" | tee /tmp/elf-attrs.txt
          # Every Kindle (2021-2024 included) runs 32-bit ARM userland; an
          # ARMv5(T/TE) soft-float baseline executes on all of them and on
          # every older generation too.
          grep -Eq 'Tag_CPU_arch: v5TE?' /tmp/elf-attrs.txt \
            || { echo "FAIL: CPU arch must be ARMv5T or v5TE"; exit 1; }
          if grep -q 'Tag_ABI_VFP_args' /tmp/elf-attrs.txt; then
            echo "FAIL: binary must stay soft-float ABI"; exit 1
          fi
          file "$BIN" | grep -q 'statically linked' \
            || { echo "FAIL: binary must be statically linked"; exit 1; }
          echo "✓ dropbearmulti is static ARMv5 soft-float — portable to all Kindles"
