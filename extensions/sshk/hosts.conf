# sshk hosts.conf - Saved SSH connection aliases
# Format: alias user@host[:port] [keyname]
#
# Examples:
# myserver admin@192.168.1.10
# work dev@work.example.com:2222
# tailnet user@mypc work
#
# Usage:
#   ssh myserver        -> connects to admin@192.168.1.10 with default key
#   ssh work            -> connects to dev@work.example.com on port 2222
#   ssh tailnet          -> connects to user@mypc using kindle_work_key
#
